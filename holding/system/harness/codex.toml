# Codex runtime driver for Holding Company OS (.agents/holding/).
# Pointer lives under holding export — not repo-root AGENTS.md, not ~/.codex/AGENTS.md.

id = "codex"
layout = "agents_md"

[tier_to_model]
dispatch = "default"
low = "default"
medium = "default"
high = "default"
xhigh = "default"

[tier_to_effort]
dispatch = "dispatch"
low = "low"
medium = "medium"
high = "high"
xhigh = "xhigh"

[tier_guidance]
dispatch = "Prefer fast routing; do not implement product. Run hop.py; Assign or spawn only the named role."
low = "Shallow tool use; follow hop; no wide refactors."
medium = "Normal depth for HR deals and coordination briefs."
high = "Deep multi-company diagnosis; still no product code in subsidiaries."
xhigh = "Rare; prefer plans under a subsidiary company, not holding."

[paths]
agents_md = ".agents/holding/cache/export/codex/AGENTS.md"
export_dir = ".agents/holding/cache/export/codex"

[boot]
skills_note = "Load context via hop.py skill: path under system/skills — do not paste whole catalogs."
